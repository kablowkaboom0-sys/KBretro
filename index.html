<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KB RETRO</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131c;color:#f6e9c8;font-family:monospace;touch-action:none}#screen{position:absolute;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;background:#141824}#menu{position:absolute;inset:0;display:grid;place-items:center;background:#10131cdd;text-align:center}#menu article{max-width:390px;padding:20px;border:3px solid #f6e9c8;background:#20273a}h1{font-size:38px;margin:0;color:#ffcb66}p{line-height:1.5}button{font: bold 17px monospace;color:#161b27;background:#ffcb66;border:0;padding:12px 20px;cursor:pointer}#touch{position:absolute;inset:0;pointer-events:none;display:none}#touch button{pointer-events:auto;position:absolute;opacity:.65;border:2px solid #fff5;background:#273349;color:white;padding:0;width:53px;height:53px;border-radius:8px;user-select:none}#touch .act{background:#9b493f}#ver{position:absolute;right:6px;bottom:4px;color:#ffffff88;font:10px monospace;pointer-events:none}@media(pointer:coarse){#touch{display:block}}
</style></head><body><canvas id="screen" width="256" height="144"></canvas><div id="menu"><article><h1>KB RETRO</h1><p>144P // OFFLINE BOT ARENA</p><p>WASD move · Mouse aim · Shift sprint<br>Space jump · Ctrl slide<br>Left click melee · Right click throw<br>Body 75 · Head 100 · Knife returns in 1 second</p><button id="start">START MATCH</button><p id="result">One opponent at a time. First to 10 eliminations wins.</p></article></div><div id="touch"><button data-k="w" style="left:76px;bottom:125px">▲</button><button data-k="a" style="left:17px;bottom:66px">◀</button><button data-k="s" style="left:76px;bottom:66px">▼</button><button data-k="d" style="left:135px;bottom:66px">▶</button><button data-k="shift" style="left:17px;bottom:8px">RUN</button><button data-k=" " style="left:76px;bottom:8px">JUMP</button><button data-k="control" style="left:135px;bottom:8px">SLIDE</button><button class="act" id="melee" style="right:17px;bottom:70px">HIT</button><button class="act" id="throw" style="right:78px;bottom:12px">THROW</button></div><div id="ver">KB RETRO v0.2</div><script>
(()=>{'use strict';
const c=document.querySelector('#screen'),g=c.getContext('2d',{alpha:false});g.imageSmoothingEnabled=false;
const W=256,H=144,PI=Math.PI,TAU=PI*2,map=[
'1111111111111111','1000000000000001','1000100000100001','1000100000100001','1000000000000001','1000001100000001','1000000000000001','1000000000000001','1000000000000001','1000000000000001','1000000000000001','1000001100000001','1000100000100001','1000100000100001','1000000000000001','1111111111111111'];
const solid=(x,y)=>!map[Math.floor(y)]||map[Math.floor(y)][Math.floor(x)]!=='0',clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),angle=a=>Math.atan2(Math.sin(a),Math.cos(a));
let p,bots=[],shots=[],particles=[],keys={},running=false,last=0,score=0,dead=0,gameTime=0,mouseX=0,aimHeight=.24,touchAim=null,zbuf=new Float32Array(W);
function spawn(){let x,y,n=0;do{x=rnd(1.5,14.5);y=rnd(1.5,14.5)}while((solid(x,y)||Math.hypot(x-p.x,y-p.y)<3)&&++n<200);return {x,y}}
function reset(){aimHeight=.24;p={x:3,y:3,a:0,hp:100,hit:-100,vx:0,vy:0,z:0,vz:0,slide:0,slideAge:0,slideSpeed:0,slideLock:false,crouch:0,knife:0,melee:0,flash:0};bots=[];shots=[];particles=[];score=0;dead=0;gameTime=0;addBot()}
function addBot(){let q=spawn();bots.push({...q,hp:100,a:0,hit:-100,knife:0,melee:0,think:rnd(0,2),strafe:Math.random()<.5?1:-1})}
function move(o,dx,dy,r=.2){if(!solid(o.x+dx+Math.sign(dx)*r,o.y)&&!solid(o.x+dx,o.y+r)&&!solid(o.x+dx,o.y-r))o.x+=dx;if(!solid(o.x,o.y+dy+Math.sign(dy)*r)&&!solid(o.x+r,o.y+dy)&&!solid(o.x-r,o.y+dy))o.y+=dy}
function hit(o,dmg,head){o.hp=Math.max(0,o.hp-dmg);o.hit=gameTime;if(o===p)p.flash=.25;for(let i=0;i<7;i++)particles.push({x:o.x,y:o.y,z:head?.48:.12,vx:rnd(-1,1),vy:rnd(-1,1),life:rnd(.2,.5)});if(o.hp<=0){if(o===p){dead++;p.hp=100;p.x=3;p.y=3;p.hit=gameTime;p.flash=.7}else{bots.splice(bots.indexOf(o),1);score++;if(score>=10)finish('VICTORY!');else addBot()}}}
function throwKnife(o){if(o.knife>0||!running)return;o.knife=1;shots.push({x:o.x+Math.cos(o.a)*.34,y:o.y+Math.sin(o.a)*.34,a:o.a,owner:o,life:1,z:o===p?aimHeight:.24,active:true})}
function melee(o){if(o.melee>0||!running)return;o.melee=.48;let targets=o===p?bots:[p];for(const t of [...targets]){let d=Math.hypot(t.x-o.x,t.y-o.y),a=Math.atan2(t.y-o.y,t.x-o.x);if(d<1.15&&Math.abs(angle(a-o.a))<.85&&!blocked(o.x,o.y,t.x,t.y))hit(t,50,false)}}
function blocked(x,y,tx,ty){let d=Math.hypot(tx-x,ty-y),n=Math.ceil(d/.08);for(let i=1;i<n;i++)if(solid(x+(tx-x)*i/n,y+(ty-y)*i/n))return true;return false}
function finish(t){running=false;document.querySelector('#menu').style.display='grid';document.querySelector('#result').textContent=t+'  ·  '+score+' eliminations / '+dead+' deaths';document.querySelector('#start').textContent='PLAY AGAIN';document.exitPointerLock?.()}
function update(dt){gameTime+=dt;p.knife=Math.max(0,p.knife-dt);p.melee=Math.max(0,p.melee-dt);p.flash=Math.max(0,p.flash-dt);if(gameTime-p.hit>=4)p.hp=Math.min(100,p.hp+5*dt);
let f=(keys.w?1:0)-(keys.s?1:0),side=(keys.d?1:0)-(keys.a?1:0),len=Math.hypot(f,side)||1;
let sprint=!!keys.shift,held=!!keys.control,base=sprint?4.2:2.7;
if(!held)p.slideLock=false;
if(held&&!p.slideLock&&p.z===0&&Math.hypot(p.vx,p.vy)>1.3){p.slide=1;p.slideAge=0;p.slideSpeed=Math.max(3.3,Math.hypot(p.vx,p.vy));p.slideLock=true}
if(p.slide>0&&held&&p.z===0){p.slideAge+=dt;
  // Initial boost only; after that friction steadily bleeds off speed.
  p.slideSpeed=p.slideAge<.38?Math.min(6.7,p.slideSpeed+7*dt):Math.max(.8,p.slideSpeed-(p.slideAge<1.1?2.5:4.3)*dt);
  let m=Math.hypot(p.vx,p.vy)||1,dirx=p.vx/m,diry=p.vy/m;
  if(f||side){let tx=(Math.cos(p.a)*f+Math.cos(p.a+PI/2)*side)/len,ty=(Math.sin(p.a)*f+Math.sin(p.a+PI/2)*side)/len;dirx+=(tx-dirx)*Math.min(1,dt*.9);diry+=(ty-diry)*Math.min(1,dt*.9);let l=Math.hypot(dirx,diry)||1;dirx/=l;diry/=l}
  p.vx=dirx*p.slideSpeed;p.vy=diry*p.slideSpeed;
  if(p.slideSpeed<=.85)p.slide=0;
}else{p.slide=0;let ax=(Math.cos(p.a)*f+Math.cos(p.a+PI/2)*side)/len*base,ay=(Math.sin(p.a)*f+Math.sin(p.a+PI/2)*side)/len*base;p.vx+=(ax-p.vx)*Math.min(1,dt*9);p.vy+=(ay-p.vy)*Math.min(1,dt*9)}
p.crouch+=( (p.slide>0?1:0)-p.crouch)*Math.min(1,dt*15);
move(p,p.vx*dt,p.vy*dt);
if(keys[' ']&&p.z<=0){p.vz=4.4;if(p.slide>0){p.vx*=1.12;p.vy*=1.12;p.slide=0;p.slideLock=true}}
p.z+=p.vz*dt;p.vz-=10*dt;if(p.z<0){p.z=0;p.vz=0}
for(const b of [...bots]){b.knife=Math.max(0,b.knife-dt);b.melee=Math.max(0,b.melee-dt);if(gameTime-b.hit>=4)b.hp=Math.min(100,b.hp+5*dt);let d=Math.hypot(p.x-b.x,p.y-b.y);b.a=Math.atan2(p.y-b.y,p.x-b.x);b.think-=dt;if(b.think<0){b.think=rnd(.8,2.5);b.strafe*=-1}let approach=d>3?1:d<1.8?-1:0,bs=1.55;move(b,(Math.cos(b.a)*approach+Math.cos(b.a+PI/2)*b.strafe*.5)*bs*dt,(Math.sin(b.a)*approach+Math.sin(b.a+PI/2)*b.strafe*.5)*bs*dt);if(d<1.05)melee(b);else if(d<8&&b.knife<=0&&!blocked(b.x,b.y,p.x,p.y)&&Math.random()<dt*.8)throwKnife(b)}
for(const s of [...shots]){s.life-=dt;if(s.active){let steps=Math.ceil(35*dt/.09);for(let i=0;i<steps;i++){s.x+=Math.cos(s.a)*35*dt/steps;s.y+=Math.sin(s.a)*35*dt/steps;if(solid(s.x,s.y)){s.active=false;break}let targets=s.owner===p?bots:[p];let victim=targets.find(t=>Math.hypot(t.x-s.x,t.y-s.y)<.26);if(victim){hit(victim,s.owner===p?(s.z>.36?100:75):75,s.z>.36);s.active=false;break}}}if(s.life<=0)shots.splice(shots.indexOf(s),1)}
for(const q of [...particles]){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.life<=0)particles.splice(particles.indexOf(q),1)}
}
function ray(a){let dx=Math.cos(a),dy=Math.sin(a),x=p.x,y=p.y;for(let t=.02;t<20;t+=.035){let xx=x+dx*t,yy=y+dy*t;if(solid(xx,yy))return {d:t,x:xx,y:yy,side:Math.abs(xx-Math.round(xx))<.045}}return {d:20,x:x+dx*20,y:y+dy*20,side:false}}
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x|0,y|0,Math.ceil(w),Math.ceil(h))}
// Hand-drawn low-resolution opponent texture, drawn once and projected as a sprite.
const enemyArt=document.createElement('canvas');enemyArt.width=24;enemyArt.height=40;
const eg=enemyArt.getContext('2d');eg.imageSmoothingEnabled=false;
function ep(x,y,w,h,color){eg.fillStyle=color;eg.fillRect(x,y,w,h)}
ep(8,1,8,2,'#342c32');ep(6,3,12,9,'#d4a27d');ep(7,3,10,2,'#3a3031');
ep(8,6,3,2,'#272c38');ep(14,6,3,2,'#272c38');ep(11,9,3,1,'#885d52');
ep(5,12,14,3,'#2a303c');ep(4,15,16,13,'#a84f46');ep(7,16,10,8,'#c46950');
ep(0,15,4,13,'#c99b77');ep(20,15,4,13,'#c99b77');ep(1,16,2,9,'#d6ae85');
ep(8,18,8,3,'#343a46');ep(9,19,6,1,'#f2cf8c');
ep(4,28,16,3,'#343743');ep(5,31,6,7,'#303847');ep(13,31,6,7,'#303847');
ep(4,38,8,2,'#171d2a');ep(12,38,8,2,'#171d2a');
function render(){rect(0,0,W,72,'#596779');rect(0,72,W,72,'#343947');for(let y=72;y<144;y+=3)rect(0,y,W,1,y%2?'#373d4b':'#303543');let bob=Math.sin(gameTime*11)*Math.min(.7,Math.hypot(p.vx,p.vy)/5),horizon=72+p.z*42-p.crouch*15+bob;
for(let x=0;x<W;x++){let a=p.a+Math.atan((x-W/2)/140),r=ray(a),d=r.d*Math.cos(a-p.a);zbuf[x]=d;let wh=Math.min(250,104/d),top=horizon-wh/2,shade=clamp(1-d/18,0.25,1),v=(r.side?110:140)*shade;rect(x,top,1,wh,'rgb('+Math.round(v)+','+Math.round(v*.96)+','+Math.round(v*.78)+')');if(Math.floor((r.x+r.y)*3)%3===0)rect(x,top,1,1,'#f0d99b')}
let sprites=[];for(const b of bots)sprites.push({x:b.x,y:b.y,z:0,type:'bot',o:b});for(const s of shots)if(s.active)sprites.push({x:s.x,y:s.y,z:s.z,type:'knife',o:s});for(const q of particles)sprites.push({x:q.x,y:q.y,z:q.z,type:'spark',o:q});sprites.sort((a,b)=>Math.hypot(b.x-p.x,b.y-p.y)-Math.hypot(a.x-p.x,a.y-p.y));
for(const s of sprites){let dx=s.x-p.x,dy=s.y-p.y,d=Math.hypot(dx,dy),ang=angle(Math.atan2(dy,dx)-p.a);if(Math.abs(ang)>1||d<.12)continue;let sx=W/2+Math.tan(ang)*140,scale=104/(d*Math.cos(ang)),y=horizon+scale*(.5-s.z);if(s.type==='bot'){let w=scale*.44,hh=scale*.84,left=sx-w/2,top=y-hh*.5;for(let xx=Math.max(0,Math.floor(left));xx<Math.min(W,Math.ceil(left+w));xx++)if(zbuf[xx]>d-.12){let src=clamp(Math.floor((xx-left)/w*24),0,23);g.drawImage(enemyArt,src,0,1,40,xx|0,top|0,1,Math.ceil(hh))}let hpw=scale*.44;rect(sx-hpw/2,top-5,hpw,2,'#15191d');rect(sx-hpw/2,top-5,hpw*s.o.hp/100,2,'#b8d78e')}else if(sx>=0&&sx<W&&zbuf[Math.floor(sx)]>d-.1){let sz=clamp(scale*.13,1,8);rect(sx-sz/2,y-sz/2,sz,Math.max(1,sz/3),s.type==='knife'?'#f9e7b1':'#f3bb64')}}
let cy=70-(aimHeight-.24)*95;rect(126,cy,4,1,'#f6e9c8');rect(128,cy-2,1,5,'#f6e9c8');rect(3,3,76,12,'#151b27');rect(5,5,70*p.hp/100,4,p.hp>35?'#91cb91':'#df7966');g.font='6px monospace';g.fillStyle='#fff1d3';g.fillText('HP '+Math.ceil(p.hp)+'/100',5,13);g.fillText('KOs '+score+'/10  DEATHS '+dead,5,23);g.fillText(p.knife>0?'RETURN '+p.knife.toFixed(1)+'s':'KNIFE READY',5,31);
rect(170,104,29,40,'#222936');rect(183,91,6,38,p.knife>0?'#515969':'#d9e0e4');rect(183,89,6,6,'#ffcb66');rect(177,124,19,7,'#b58d6d');if(p.melee>.26)rect(166,91,26,4,'#e3e5e6');if(p.flash>0){g.fillStyle='rgba(255,85,65,'+(p.flash*.45)+')';g.fillRect(0,0,W,H)}}
function frame(t){let dt=Math.min(.04,(t-last)/1000||.016);last=t;if(running)update(dt);render();requestAnimationFrame(frame)}reset();requestAnimationFrame(frame);
function start(){reset();running=true;document.querySelector('#menu').style.display='none';last=performance.now();if(matchMedia('(pointer:fine)').matches)c.requestPointerLock?.()}
document.querySelector('#start').onclick=start;document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if([' ','arrowup','arrowdown','control'].includes(k))e.preventDefault();if(k==='escape'&&running)finish('PAUSED')});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.addEventListener('mousemove',e=>{if(document.pointerLockElement===c&&running){p.a+=e.movementX*.0035;aimHeight=clamp(aimHeight-e.movementY*.003,.08,.5)}});c.addEventListener('click',()=>{if(running){if(document.pointerLockElement!==c&&matchMedia('(pointer:fine)').matches)c.requestPointerLock?.();melee(p)}});c.addEventListener('contextmenu',e=>e.preventDefault());c.addEventListener('mousedown',e=>{if(e.button===2)throwKnife(p)});document.querySelector('#melee').onpointerdown=e=>{e.preventDefault();melee(p)};document.querySelector('#throw').onpointerdown=e=>{e.preventDefault();throwKnife(p)};
for(const b of document.querySelectorAll('[data-k]')){let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true};b.onpointerup=b.onpointercancel=()=>keys[k]=false}
c.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')touchAim={id:e.pointerId,x:e.clientX,y:e.clientY}});c.addEventListener('pointermove',e=>{if(touchAim&&e.pointerId===touchAim.id){p.a+=(e.clientX-touchAim.x)*.008;aimHeight=clamp(aimHeight-(e.clientY-touchAim.y)*.004,.08,.5);touchAim.x=e.clientX;touchAim.y=e.clientY}});c.addEventListener('pointerup',e=>{if(touchAim?.id===e.pointerId)touchAim=null});
})();
</script></body></html>
