<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KB RETRO 2P</title><style>*{box-sizing:border-box}body{margin:0;background:#111722;color:#ffda8a;font:14px monospace;overflow:hidden;touch-action:none}canvas{width:100vw;height:100dvh;image-rendering:pixelated}#bar{position:absolute;top:2px;left:50%;transform:translateX(-50%);background:#111b;z-index:2;white-space:nowrap}button{background:#26364b;color:white;border:1px solid #fff8;border-radius:5px;padding:8px;touch-action:none}.side{position:absolute;top:0;width:50%;height:100%;pointer-events:none}.left{left:0}.right{right:0}.pad{position:absolute;bottom:12px;left:5px;display:grid;grid-template-columns:repeat(3,30px);grid-template-rows:repeat(3,30px);pointer-events:auto}.pad button{padding:0}.pad button:nth-child(1){grid-area:1/2}.pad button:nth-child(2){grid-area:2/1}.pad button:nth-child(3){grid-area:2/3}.pad button:nth-child(4){grid-area:3/2}.acts{position:absolute;right:5px;bottom:12px;display:grid;grid-template-columns:repeat(2,45px);gap:3px;pointer-events:auto}.acts button{font-size:10px;padding:6px}#menu{position:absolute;inset:0;display:grid;place-items:center;background:#111e;z-index:4;text-align:center}article{padding:20px;border:2px solid #ffda8a;background:#20283a;max-width:90vw}</style><canvas id="c" width="512" height="144"></canvas><div id="bar"><button onclick="location.href='./'">MENU</button> <span id="score">P1 0 - 0 P2</span> <button id="reset">RESET</button></div><div class="side left" data-i="0"><div class="pad"><button data-dir="f">▲</button><button data-dir="l">◀</button><button data-dir="r">▶</button><button data-dir="b">▼</button></div><div class="acts"><button data-act="jump">JUMP</button><button data-act="hit">HIT</button><button data-act="throw">THROW</button></div></div><div class="side right" data-i="1"><div class="pad"><button data-dir="f">▲</button><button data-dir="l">◀</button><button data-dir="r">▶</button><button data-dir="b">▼</button></div><div class="acts"><button data-act="jump">JUMP</button><button data-act="hit">HIT</button><button data-act="throw">THROW</button></div></div><div id="menu"><article><h1>2 PLAYER LOCAL</h1><p>LEFT: WASD · RIGHT: ARROWS</p><p>Drag your half to look. Each half has touch movement, jump, hit and throw. First to 6 wins.</p><button id="play">PLAY</button></article></div><script>(()=>{const c=document.querySelector('#c'),g=c.getContext('2d'),W=256,H=144,grid=['1111111111111111','1000000000000001','1000100000100001','1000000000000001','1000000000000001','1000001100000001','1000000000000001','1000000000000001','1000000000000001','1000000000000001','1000001100000001','1000000000000001','1000100000100001','1000000000000001','1000000000000001','1111111111111111'];let p=[],score=[0,0],keys={},shots=[],active=false,wait=0,last=performance.now();const solid=(x,y)=>!grid[y|0]||grid[y|0][x|0]!=='0',angle=x=>Math.atan2(Math.sin(x),Math.cos(x));function blocked(a,b){let d=Math.hypot(a.x-b.x,a.y-b.y);for(let t=.08;t<d;t+=.08)if(solid(a.x+(b.x-a.x)*t/d,a.y+(b.y-a.y)*t/d))return true;return false}function spawn(){p=[{x:3,y:3,a:.7},{x:13,y:13,a:3.9}].map(o=>({...o,hp:100,z:0,vz:0,cd:0,tc:0,flash:0,aim:0,held:{}}));shots=[];wait=1.5}function reset(){score=[0,0];document.querySelector('#score').textContent='P1 0 - 0 P2';spawn();active=true;document.querySelector('#menu').style.display='none'}function damage(i,n,by){if(!active||wait)return;let q=p[i];q.hp=Math.max(0,q.hp-n);q.flash=.25;if(!q.hp){score[by]++;document.querySelector('#score').textContent='P1 '+score[0]+' - '+score[1]+' P2';if(score[by]===6){active=false;document.querySelector('#menu').style.display='grid';document.querySelector('#menu h1').textContent='PLAYER '+(by+1)+' WINS';document.querySelector('#play').textContent='PLAY AGAIN'}else spawn()}}function act(i,a){if(!active||wait)return;let q=p[i],r=p[1-i];if(a==='jump'&&!q.z)q.vz=3;if(a==='hit'&&!q.cd){q.cd=.5;if(Math.hypot(q.x-r.x,q.y-r.y)<1.5&&Math.abs(angle(Math.atan2(r.y-q.y,r.x-q.x)-q.a))<.85&&!blocked(q,r))damage(1-i,40,i)}if(a==='throw'&&!q.tc){q.tc=1.2;shots.push({x:q.x,y:q.y,a:q.a,owner:i,life:.6})}}function move(q,dx,dy){if(!solid(q.x+dx+Math.sign(dx)*.2,q.y))q.x+=dx;if(!solid(q.x,q.y+dy+Math.sign(dy)*.2))q.y+=dy}function update(dt){if(!active)return;if(wait){wait=Math.max(0,wait-dt);return}p.forEach((q,i)=>{let k=i?['arrowup','arrowdown','arrowleft','arrowright','enter','/','.']:['w','s','a','d',' ','f','g'],h=q.held,f=Number(!!keys[k[0]]||!!h.f)-Number(!!keys[k[1]]||!!h.b),s=Number(!!keys[k[3]]||!!h.r)-Number(!!keys[k[2]]||!!h.l),m=Math.max(1,Math.hypot(f,s));move(q,(Math.cos(q.a)*f-Math.sin(q.a)*s)*dt*2.8/m,(Math.sin(q.a)*f+Math.cos(q.a)*s)*dt*2.8/m);q.z=Math.max(0,q.z+q.vz*dt);q.vz=q.z?q.vz-12*dt:0;q.cd=Math.max(0,q.cd-dt);q.tc=Math.max(0,q.tc-dt);q.flash=Math.max(0,q.flash-dt);['jump','hit','throw'].forEach((a,j)=>{if(keys[k[4+j]]&&!q[a+'lock']){act(i,a);q[a+'lock']=true}else if(!keys[k[4+j]])q[a+'lock']=false})});for(let s of [...shots]){s.life-=dt;let steps=Math.ceil(dt*350);for(let j=0;j<steps&&s.life>0;j++){s.x+=Math.cos(s.a)*30*dt/steps;s.y+=Math.sin(s.a)*30*dt/steps;if(solid(s.x,s.y)){s.life=0;break}let r=p[1-s.owner];if(Math.hypot(s.x-r.x,s.y-r.y)<.3){s.life=0;damage(1-s.owner,60,s.owner);break}}if(s.life<=0)shots.splice(shots.indexOf(s),1)}}function view(i){let q=p[i],r=p[1-i],ox=i*W;g.save();g.beginPath();g.rect(ox,0,W,H);g.clip();g.fillStyle='#66798c';g.fillRect(ox,0,W,H/2);g.fillStyle='#39434e';g.fillRect(ox,H/2,W,H/2);let z=[];for(let x=0;x<W;x++){let a=q.a+Math.atan((x-128)/145),d=0,rx,ry;do{d+=.04;rx=q.x+Math.cos(a)*d;ry=q.y+Math.sin(a)*d}while(d<20&&!solid(rx,ry));let dist=d*Math.cos(a-q.a),ht=Math.min(300,105/Math.max(.1,dist));z[x]=dist;g.fillStyle=Math.abs(rx-Math.round(rx))<.05?'#64758b':'#8795a4';g.fillRect(ox+x,72-ht/2+q.aim*35+q.z*18,1,ht)}let d=Math.hypot(r.x-q.x,r.y-q.y),a=angle(Math.atan2(r.y-q.y,r.x-q.x)-q.a),front=d*Math.cos(a);if(front>.1&&Math.abs(a)<1&&!blocked(q,r)){let sx=Math.round(128+Math.tan(a)*145),size=Math.min(110,75/front),top=72-size/2+(q.z-r.z)*18+q.aim*35;for(let x=Math.max(0,Math.floor(sx-size*.23));x<Math.min(W,Math.ceil(sx+size*.23));x++)if(front<z[x]){g.fillStyle=i?'#c65d50':'#e5ad79';g.fillRect(ox+x,top+size*.25,1,size*.55);g.fillStyle='#273041';g.fillRect(ox+x,top+size*.8,1,size*.2)}g.fillStyle='#d6ab85';g.fillRect(ox+sx-size*.14,top+size*.03,size*.28,size*.23)}g.fillStyle='#17191d';g.fillRect(ox+212,112,35,40);g.fillStyle='#bbc2c7';g.fillRect(ox+199,91,34,5);g.fillStyle='#fff0c8';g.fillRect(ox+125,72,7,1);g.fillRect(ox+128,69,1,7);g.fillStyle='#111b';g.fillRect(ox+3,4,80,17);g.fillStyle='#ffda8a';g.font='bold 9px monospace';g.fillText('P'+(i+1)+' HP '+q.hp,ox+7,16);if(q.flash){g.fillStyle='#ff503b55';g.fillRect(ox,0,W,H)}if(wait){g.fillStyle='#ffda8a';g.font='bold 24px monospace';g.fillText(Math.ceil(wait),ox+120,40)}g.restore()}function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);if(p.length){view(0);view(1)}g.fillStyle='#ffda8a';g.fillRect(255,0,2,H);requestAnimationFrame(frame)}document.querySelector('#play').onclick=reset;document.querySelector('#reset').onclick=reset;document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys[k]=true});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('.side').forEach(el=>{let i=+el.dataset.i;el.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);p[i].held[d]=true};b.onpointerup=b.onpointercancel=()=>p[i].held[d]=false});el.querySelectorAll('[data-act]').forEach(b=>b.onpointerdown=e=>{e.preventDefault();act(i,b.dataset.act)})});let drag=new Map();c.onpointerdown=e=>{if(!active)return;let i=e.clientX<innerWidth/2?0:1;drag.set(e.pointerId,{i,x:e.clientX,y:e.clientY});c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{let a=drag.get(e.pointerId);if(!a)return;p[a.i].a+=(e.clientX-a.x)*.008;p[a.i].aim=Math.max(-1,Math.min(1,p[a.i].aim-(e.clientY-a.y)*.006));a.x=e.clientX;a.y=e.clientY};c.onpointerup=c.onpointercancel=e=>drag.delete(e.pointerId);spawn();requestAnimationFrame(frame)})();</script></html>
